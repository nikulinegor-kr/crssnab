  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <meta name="keywords" content="CRSS, снабжение, автоматизация, ERP, управление поставками, закупки, логистика" />
    <meta name="author" content="CRSS" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crssnab.ru/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRSS — Платформа автоматизации корпоративного снабжения" />
    <meta name="twitter:description" content="Единая платформа автоматизации и аналитики, которая делает поставки быстрее, прозрачнее и эффективнее." />
    <meta name="twitter:image" content="/crss-logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://crssnab.ru/" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0080ff" />
    
    <link rel="icon" href="/favicon.png" type="image/png" />
    
    <!-- Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    </noscript>
    <style>
      :root {
        color-scheme: light;
        --boot-bg: hsl(210 40% 98%);
        --boot-fg: hsl(222 47% 11%);
        --boot-muted: hsl(215 16% 47%);
        --boot-border: hsl(214 32% 91%);
        --boot-card: hsl(0 0% 100% / 0.96);
        --boot-primary: hsl(207 100% 50%);
      }

      html, body {
        min-height: 100%;
        margin: 0;
        background: var(--boot-bg);
        color: var(--boot-fg);
      }

      body {
        font-family: Manrope, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .boot-card {
        width: min(100%, 420px);
        border: 1px solid var(--boot-border);
        border-radius: 12px;
        background: var(--boot-card);
        box-shadow: 0 10px 30px hsl(222 47% 11% / 0.08);
        padding: 24px;
        text-align: center;
      }

      .boot-mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 999px;
        background: hsl(210 40% 96%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-spinner {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 2px solid var(--boot-primary);
        border-top-color: transparent;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-title {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
      }

      .boot-text {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--boot-muted);
      }

      .boot-noscript {
        margin-top: 16px;
        font-size: 13px;
        color: var(--boot-muted);
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-shell" aria-live="polite" aria-busy="true">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">
            <div class="boot-spinner"></div>
          </div>
          <h1 class="boot-title">Загрузка CRSS</h1>
          <p class="boot-text">Подготавливаем приложение. Если сеть отвечает нестабильно, этот экран останется видимым до полной загрузки интерфейса.</p>
          <noscript>
            <p class="boot-noscript">Для работы приложения нужен включенный JavaScript.</p>
          </noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
